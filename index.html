": ["C"], "e": ""}, {"ch": 5, "n": 120, "q": "Command Prompt trong Hệ điều hành Windows là dạng gì?", "o": {"A": "là lớp Shell đặt trong Kernel.", "B": "là lớp Kernel dưới dạng ứng dụng.", "C": "là lớp Kernel đặt trong Shell.", "D": "là lớp Shell dưới dạng một ứng dụng."}, "a": ["D"], "e": ""}, {"ch": 5, "n": 121, "q": "Command Prompt trong Hệ điều hành MS-DOS là dạng gì?", "o": {"A": "là lớp Shell đặt trong Kernel.", "B": "là lớp Kernel dưới dạng ứng dụng.", "C": "là lớp Kernel đặt trong Shell.", "D": "là lớp Shell dưới dạng một ứng dụng."}, "a": ["A"], "e": ""}, {"ch": 5, "n": 122, "q": "Terminal trong Hệ điều hành Linux là dạng gì?", "o": {"A": "là lớp Shell đặt trong Kernel.", "B": "là lớp Kernel dưới dạng ứng dụng.", "C": "là lớp Kernel đặt trong Shell.", "D": "là lớp Shell dưới dạng một ứng dụng."}, "a": ["D"], "e": ""}, {"ch": 5, "n": 123, "q": "Hệ điều hành Windows 10 cung cấp giao diện người dùng (User interface) theo dạng nào?", "o": {"A": "Command line interface (CLI).", "B": "Graphic User Interface (GUI)", "C": "Cả 2 dạng GUI và CLI", "D": "Window User Interface (WUI)"}, "a": ["C"], "e": ""}, {"ch": 5, "n": 124, "q": "Lịch sử phát triển của Hệ điều hành bùng nổ trong theo thời đại công nghệ điện tử nào?", "o": {"A": "công nghệ điện tử dùng đèn chân không (vacuum).", "B": "công nghệ điện tử dùng bán dẫn (transistors)", "C": "công nghệ điện tử dùng mạch tích hợp (Integrated Circuits – IC)", "D": "công nghệ điện tử dùng VLSI (Very large-scale integration)"}, "a": ["D"], "e": ""}, {"ch": 5, "n": 125, "q": "Hệ điều hành thực hiện các tác vụ lần lượt theo những chỉ thị đã được xác định trước. Tên gọi của Hệ điều hành đó là:", "o": {"A": "Hệ điều hành xử lý theo lô đơn giản", "B": "Hệ điều hành xử lý đa chương", "C": "Hệ điều hành chia sẻ thời gian", "D": "Hệ điều hành xử lý thời gian thực."}, "a": ["A"], "e": ""}, {"ch": 5, "n": 126, "q": "Đâu là ưu điểm chính của Hệ thống xử lý đa chương (multiprogramming system)?", "o": {"A": "Chương trình khi nạp vào bộ nhớ sẽ được xử lý hoàn thành ngay lập tức.", "B": "Hệ thống chạy được nhiều chương trình cùng lúc.", "C": "Không cần thiết lập định thời công việc (job scheduling) và qu3n lý bộ nhớ.", "D": "Tối ưu sử dụng bộ nhớ."}, "a": ["B"], "e": ""}, {"ch": 5, "n": 19, "q": "Mục dích chính của Hệ thống xử lý đa chương (multiprogramming system) là gì?", "o": {"A": "Thực hiện đồng thời nhiều chương trình.", "B": "Tận dụng thời gian nhàn rỗi của CPU.", "C": "Chia sẻ thời gian giữa các chương trình.", "D": "Tận dụng RAM, ROM khi đọc ghi."}, "a": ["B"], "e": ""}, {"ch": 5, "n": 20, "q": "Điều kiện nào sau đây KHÔNG CẦN cho hoạt động đa chương của hệ điều hành?", "o": {"A": "Định thời CPU (CPU scheduling).", "B": "Quản lý bộ nhớ (memory management).", "C": "Cấp phát tài nguyên (đĩa, máy in…).", "D": "Ứng dụng được lập trình đa nhiệm."}, "a": ["D"], "e": ""}, {"ch": 5, "n": 21, "q": "Phát biểu nào sau đây KHÔNG ĐÚNG với hệ thống chia sẻ thời gian (time-sharing)?", "o": {"A": "time-sharing là một hệ thống đa nhiệm (multi-tasking).", "B": "time-sharing yêu cầu thời gian chuyển đổi giữa các tác vụ rất ngắn.", "C": "time-sharing yêu cầu phải định thời CPU.", "D": "time-sharing yêu cầu hoàn thành xong nhiệm vụ 1 mới chia sẻ cho nhiệm vụ 2."}, "a": ["D"], "e": ""}, {"ch": 5, "n": 22, "q": "Hệ điều hành nào sau đây đòi hỏi phải thực hiện đầy đủ các tác vụ: Quản lý tiến trình, Định thời CPU, Quản lý bộ nhớ, Quản lý cấp phát tài nguyên, Quản lý file?", "o": {"A": "Hệ điều hành xử lý đơn chương.", "B": "Hệ điều hành xử lý theo lô đơn giản.", "C": "Hệ điều hành xử lý đa chương.", "D": "Hệ điều hành xử lý chia sẻ thời gian (Time-sharing)."}, "a": ["D"], "e": ""}, {"ch": 5, "n": 23, "q": "Trong hệ thống xử lý đa nhiệm (multitasking), việc chuyển đổi giữa các công việc diễn ra:", "o": {"A": "Sau một khoảng thời gian tùy theo công việc yêu cầu.", "B": "Chuyển đổi khi có công việc khác cần xử lý.", "C": "Luân phiên xoay vòng hoàn thành từng công việc.", "D": "Luân phiên xoay vòng, không đợi công việc ho const t=k=>T[lang][k];const $=id=>document.getElementById(id);const LET='ABCD';
let Q=[],i=0,done=false,sel=new Set(),score=0,wrong=[],active=false;
function chips(){const on=new Set([...document.querySelectorAll('.cb:checked')].map(x=>+x.value));const first=!document.querySelector('.cb');const c=$('chs');c.innerHTML='';
Object.keys(CH).forEach(k=>{const n=D.filter(d=>d.ch==k).length;const l=document.createElement('label');l.className='k';
l.innerHTML='<input type="checkbox" class="cb" value="'+k+'"><span></span><span class="mu"></span>'+(k==6||k>10?'<span class="tag"></span>':'');
l.children[0].checked=first||on.has(+k);l.children[1].textContent=CH[k][lang];l.children[2].textContent=t('nq')(n);if(l.children[3])l.children[3].textContent=k==6?t('added'):t('bonus');c.appendChild(l)})}
const pool=()=>{const on=[...document.querySelectorAll('.cb:checked')].map(x=>+x.value);return D.filter(d=>on.includes(d.ch))};
const upd=()=>{const p=pool().length;$('cnt').textContent=t('cnt')(p);$('go').disabled=!p};
function apply(){document.documentElement.lang=lang;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));$('allopt').textContent=t('all');$('lang').textContent=lang=='vi'?'EN':'VI';chips();upd();if(active){$('nx').textContent=i==Q.length-1?t('fin'):t('next');meta()}}
$('lang').onclick=()=>{lang=lang=='vi'?'en':'vi';try{localStorage.setItem('lang',lang)}catch(e){}apply()};
document.addEventListener('change',e=>{if(e.target.classList.contains('cb'))upd()});
const sh=a=>{a=a.slice();for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a};
const letters=(d,ks,keys)=>keys.map(k=>LET[ks.indexOf(k)]).sort().join(', ');
function start(list){Q=list;i=0;score=0;wrong=[];active=true;$('setup').classList.add('hid');$('res').classList.add('hid');$('quiz').classList.remove('hid');show()}
$('go').onclick=()=>{let p=pool();if($('shuf').checked)p=sh(p);const n=+$('num').value;start(n?p.slice(0,n):p)};
function meta(){const d=Q[i];$('meta').textContent=t('q')+' '+(i+1)+'/'+Q.length+' · '+CH[d.ch][lang].split(':')[0]+(typeof d.n=='number'?t('orig')+d.n:' · '+(d.ch==6?t('added'):t('bonus')))+(d.a.length>1?t('multi'):'')}
function pickOpt(k){if(done)return;const d=Q[i];if(d.a.length>1){sel.has(k)?sel.delete(k):sel.add(k)}else{sel=new Set([k])}[...$('ops').children].forEach(c=>c.classList.toggle('sel',sel.has(c.dataset.k)))}
function show(){done=false;sel=new Set();const d=Q[i];$('pb').style.width=(i/Q.length*100)+'%';meta();$('qt').textContent=d.q;
let ks=Object.keys(d.o);if($('shufo').checked&&!/tất cả|cả hai|cả 2|đều đúng|A và|không có/i.test(JSON.stringify(d.o)))ks=sh(ks);d._ks=ks;$('ops').innerHTML='';
ks.forEach((k,x)=>{const el=document.createElement('div');el.className='o';el.dataset.k=k;el.innerHTML='<b>'+LET[x]+'</b><span></span>';el.lastChild.textContent=d.o[k];el.onclick=()=>pickOpt(k);$('ops').appendChild(el)});
$('ex').classList.add('hid');$('nx').classList.add('hid');$('chk').classList.remove('hid');$('nx').textContent=i==Q.length-1?t('fin'):t('next')}
function check(){if(!sel.size||done)return;done=true;const d=Q[i];const ok=d.a.length==sel.size&&d.a.every(x=>sel.has(x));
[...$('ops').children].forEach(c=>{const k=c.dataset.k;if(d.a.includes(k))c.classList.add('ok');else if(sel.has(k))c.classList.add('no')});
if(ok)score++;else wrong.push({d,ks:d._ks.slice(),pick:[...sel]});
$('ex').textContent=(ok?t('okm'):t('nom'))+t('ans')+letters(d,d._ks,d.a)+(d.e?' — '+d.e:'');$('ex').classList.remove('hid');$('chk').classList.add('hid');$('nx').classList.remove('hid')}
function next(){if(!done)return;if(i<Q.length-1){i++;show()}else finish()}
$('chk').onclick=check;$('nx').onclick=next;
$('quit').onclick=()=>{if(confirm(t('quitq'))){active=false;$('quiz').classList.add('hid');$('setup').classList.remove('hid')}};
document.addEventListener('keydown',e=>{if(!active||e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase();const x=LET.toLowerCase().indexOf(k);
if(x>=0&&Q[i]&&x<Q[i]._ks.length&&!$('quiz').classList.contains('hid')){pickOpt(Q[i]._ks[x]);e.preventDefault()}
else if(e.key=='Enter'&&!$('quiz').classList.contains('hid')){done?next():check();e.preventDefault()}});
function finish(){active=false;$('quiz').classList.add('hid');$('res').classList.remove('hid');$('sc').textContent=score+'/'+Q.length;const pct=Math.round(score/Q.length*100);$('pc').textContent=t('pc')(pct);$('ring').style.setProperty('--p',pct);
$('wrongb').disabled=!wrong.length;$('rv').innerHTML=wrong.length?'':'<p class="mu">'+t('perfect')+'</p>';
wrong.forEach(w=>{const v=document.createElement('div');v.className='rv';const a=document.createElement('div');a.style.fontWeight='bold';a.textContent=w.d.q;const b=document.createElement('div');b.className='mu';
b.textContent=t('your')+letters(w.d,w.ks,w.pick)+' · '+t('ans')+w.d.a.map(k=>LET[w.ks.indexOf(k)]+'. '+w.d.o[k]).sort().join(' | ');v.append(a,b);$('rv').appendChild(v)})}
$('again').onclick=()=>{$('res').classList.add('hid');$('setup').classList.remove('hid')};
$('wrongb').onclick=()=>start(sh(wrong.map(w=>w.d)));
apply();
</script></body></html>
